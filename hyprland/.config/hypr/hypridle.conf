# hypridle config
# Inactivity timeouts (seconds), each counted from the last user activity.
# 1200s = 20 min -> lock the screen with hyprlock
# 1800s = 30 min (20 min lock + another 10) -> turn off the screen

listener {
    timeout = 1200
    on-timeout = hyprlock
}

listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
